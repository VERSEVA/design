name: gates
on:
  push:
  pull_request:
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run gate
      # The studio suite carries the rendered checks (accent count, React parts, axe) and typechecks react/.
      - run: npm --prefix studio ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm --prefix studio test
