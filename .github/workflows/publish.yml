# Publishes @verseva/design to the PUBLIC npm registry on every published
# release (open-source ruling, 2026-08-31; v1.0.0 is the first public cut).
#
# Auth is npm trusted publishing (OIDC): npmjs.com trusts VERSEVA/design,
# workflow publish.yml, so no token or secret is stored. Needs npm 11.5.1+.
#
# Consumers:
#   npm i @verseva/design
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        if: github.event_name != 'workflow_dispatch'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm run gate
      - run: npm publish --access public
