# Publishes @verseva/design to the PUBLIC npm registry on every published
# release (open-source ruling, 2026-08-31; v1.0.0 is the first public cut).
#
# Auth is npm trusted publishing (OIDC): npmjs.com trusts VERSEVA/design,
# workflow publish.yml, so no token or secret is stored. Needs npm 11.5.1+.
#
# Consumers:
#   npm i @verseva/design
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm run gate
      - run: npm publish --access public
