# Publishes @verseva/design-core to GitHub Packages on every published release.
#
# The npm scope must match the repo owner on GitHub Packages; this repo lives
# under the VERSEVA org (logins are case-insensitive; the scope is @verseva),
# so publishing is live. The guard below is a safety net that skips cleanly if
# the repo is ever forked or moved to a non-matching owner.
#
# Consumers, once live:
#   .npmrc      @verseva:registry=https://npm.pkg.github.com
#               //npm.pkg.github.com/:_authToken=${NPM_TOKEN}
#   package.json  "@verseva/design-core": "^0.1.0"
#   Vercel: set NPM_TOKEN (a read:packages token) in project env.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard, scope must match owner
        id: guard
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          if [ "$owner" != "verseva" ]; then
            echo "repo owner is ${GITHUB_REPOSITORY_OWNER}, scope is @verseva: skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm test
        if: steps.guard.outputs.skip != 'true'
      - run: npm publish
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
