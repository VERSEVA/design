# Publishes @verseva/design to the PUBLIC npm registry on every published
# release (open-source ruling, 2026-08-31; v1.0.0 is the first public cut).
#
# Requires the NPM_TOKEN repo secret: an npmjs automation token with publish
# rights on the @verseva org.
#
# Consumers:
#   npm i @verseva/design
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm run gate
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
