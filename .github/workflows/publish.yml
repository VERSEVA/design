# Publishes @verseva/design to the PUBLIC npm registry on every published
# release (open-source ruling, 2026-08-31; v1.0.0 is the first public cut).
#
# Auth is npm trusted publishing (OIDC): npmjs.com trusts VERSEVA/design,
# workflow publish.yml, so no token or secret is stored. Needs npm 11.5.1+.
#
# Consumers:
#   npm i @verseva/design
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm test
      - run: npm run gate
      - run: npm publish --access public
